      <span></span><span></span><span></span>
    </button>
    <nav class="nav__menu" id="navMenu" aria-label="Main navigation">
      <ul class="nav__list">
        <li><a class="nav__link" href="../index.html#hero">Index</a></li>

</header>
<main>
<div class="container">
  <nav class="crumb" aria-label="Breadcrumb">
    <a href="../index.html">Index</a>
    <span class="crumb__sep">/</span>
    <span class="crumb__current">Ask</span>
  </nav>
</div>

<section class="detail-hero">
  <div class="container">
    <p class="section__eyebrow">Ask</p>
    <h1 class="detail-hero__title">Ask about my work</h1>
    <p class="detail-hero__lead">Answers are grounded only in this site's profile (teaching, research, trajectory, publications).</p>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="ask" id="askWidget">
      <form class="ask__form" id="askForm" novalidate>
        <label class="ask__label" for="askInput" id="askLabel">Your question</label>
        <textarea class="ask__input" id="askInput" name="question" rows="3" maxlength="2000"
                  placeholder="e.g. What courses does he teach?"></textarea>
        <div class="ask__actions">
          <span class="ask__counter" id="askCounter" aria-hidden="true">0 / 2000</span>
          <button type="submit" class="ask__submit" id="askSubmit">Ask</button>
        </div>
      </form>

      <div class="ask__chips" id="askChips">
        <span class="ask__chips-label">Try</span>
        <button type="button" class="ask__chip">What is his current role?</button>
        <button type="button" class="ask__chip">How does he use AI in teaching?</button>
        <button type="button" class="ask__chip">Which courses does he teach?</button>
      </div>

      <p class="ask__status" id="askStatus" role="status"></p>
      <div class="ask__answer" id="askAnswer" hidden></div>
    </div>
  </div>
</section>
</main>
